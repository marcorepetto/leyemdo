[project]
name = "pdf-lectura-backend"
version = "0.1.0"
description = "Backend para Lector de PDF Inteligente"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.1",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "lancedb>=0.34.0",
    "pyarrow>=25.0.0",
    "httpx>=0.28.1",
    "sse-starlette>=3.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]
