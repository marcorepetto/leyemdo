# Configuración básica de Ruff para el backend
line-length = 120
target-version = "py311"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "B008",  # Do not perform function call File/Query in argument defaults (común en FastAPI)
    "C901",  # McCabe complexity check (desactivado para algoritmos recursivos complejos)
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
